<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 294 72" width="294" height="72">
  <title>WowWatchr</title>
  <style>
    /* Same choreography as the other Watchr logos: the sign builds up, the sword drops in,
       the name rises; then the timer keeps ticking down and refills. */
    .track { opacity: 0; animation: fade .4s ease .1s forwards; }
    .arc { stroke-dasharray: 0 100; animation: fill .8s cubic-bezier(.6, 0, .2, 1) .2s forwards, tick 5s steps(1, end) 1.4s infinite; }
    .sword { opacity: 0; transform: translateY(-8px); animation: drop .4s cubic-bezier(.3, 1.4, .5, 1) .6s forwards; }
    .word { opacity: 0; animation: rise .5s ease .75s forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes fill { to { stroke-dasharray: 70 100; } }
    @keyframes tick { 0% { stroke-dasharray: 70 100; } 20% { stroke-dasharray: 65 100; } 40% { stroke-dasharray: 60 100; } 60% { stroke-dasharray: 55 100; } 80% { stroke-dasharray: 50 100; } 100% { stroke-dasharray: 70 100; } }
    @keyframes drop { to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .track, .arc, .sword, .word { animation: none; opacity: 1; transform: none; stroke-dasharray: 70 100; } }
  </style>

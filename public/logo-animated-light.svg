<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 259 72" width="259" height="72">
  <title>WowWatchr</title>
  <style>
    /* Same choreography as the other Watchr logos: the sign builds up, the white shape
       draws in, the name rises. Then the M+ timer ticks down once per second from 70 % to half and refills. */
    .track { opacity: 0; animation: fade .4s ease .1s forwards; }
    .timer { stroke-dashoffset: 70; animation: draw .7s cubic-bezier(.6, 0, .2, 1) .1s forwards, tick 5s step-end 1.4s infinite; }
    .sword-line { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .45s ease-out .55s forwards; }
    .sword-fill { opacity: 0; animation: fade .3s ease .95s forwards; }
    .word { opacity: 0; animation: rise .5s ease .75s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes tick { 0% { stroke-dasharray: 70 100; } 20% { stroke-dasharray: 65 100; } 40% { stroke-dasharray: 60 100; } 60% { stroke-dasharray: 55 100; } 80% { stroke-dasharray: 50 100; } 100% { stroke-dasharray: 70 100; } }
    @media (prefers-reduced-motion: reduce) { .track, .timer, .sword-line, .sword-fill, .word { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>
  <g class="mark"><defs><mask id="ww-cut-al"><rect x="-8" y="-8" width="80" height="80" fill="#fff"/><path d="M32 11L36 15V38.5H39.4A2.6 2.6 0 0 1 39.4 43.7H34.3V49.6A3.2 3.2 0 1 1 29.7 49.6V43.7H24.6A2.6 2.6 0 0 1 24.6 38.5H28V15Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round"/></mask></defs><g mask="url(#ww-cut-al)"><circle class="track" cx="32" cy="32" r="21" fill="none" stroke="#e9dab1" stroke-width="6"/><circle class="timer" cx="32" cy="32" r="21" fill="none" stroke="#c99400" stroke-width="6" pathLength="100" stroke-dasharray="70 100" transform="rotate(-90 32 32)"/></g><path class="sword-fill" d="M32 11L36 15V38.5H39.4A2.6 2.6 0 0 1 39.4 43.7H34.3V49.6A3.2 3.2 0 1 1 29.7 49.6V43.7H24.6A2.6 2.6 0 0 1 24.6 38.5H28V15Z" fill="#111111"/><path class="sword-line" pathLength="100" d="M32 11L36 15V38.5H39.4A2.6 2.6 0 0 1 39.4 43.7H34.3V49.6A3.2 3.2 0 1 1 29.7 49.6V43.7H24.6A2.6 2.6 0 0 1 24.6 38.5H28V15Z" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round"/></g>

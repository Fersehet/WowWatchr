<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Login · WowWatchr</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/editor.css" />
    <!-- Wie login.html von FaceitWatchr: Karte, Kicker, große Felder, Button in der Akzentfarbe -->
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(900px 500px at 50% -10%, rgba(255, 209, 0, .12), transparent 70%), var(--bg); font-size: 17px; line-height: 1.6; }
      .login { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
      .login .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
      .eyebrow { font: 600 13px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
      .login h1 { font: 700 32px/1.1 var(--f-display); margin: 12px 0 8px; }
      .sub { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
      .login label { display: block; font: 600 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .login label span { display: block; margin-bottom: 8px; }
      .login input { display: block; width: 100%; font: 500 17px/1.2 var(--f-body); background: var(--bg-2); border-radius: 8px; padding: 13px 14px; margin-bottom: 18px; text-transform: none; letter-spacing: 0; }
      .login button[type='submit'] { width: 100%; font-size: 15px; letter-spacing: .04em; padding: 15px 20px; }
      .login button[type='submit']:hover { box-shadow: 0 8px 24px var(--glow); }
      .login button:disabled { opacity: .6; cursor: wait; box-shadow: none; }
      .msg { min-height: 1.5em; margin: 14px 0 0; color: var(--danger); font-size: 15px; }
      .msg.info { color: var(--muted); }
      @media (max-width: 400px) { .login { padding: 26px 20px 22px; } }
    </style>
  </head>
  <body>
    <form class="login" id="loginForm" novalidate>
      <div class="top">
        <div class="brand"><img class="brand-mark" src="/logo.svg" alt="" width="28" height="28" /><img class="brand-word" src="/logo-wordmark.svg" alt="WowWatchr" width="118" height="18" /></div>
        <select id="langSel" class="lang"></select>
      </div>
      <div class="eyebrow" data-i18n="loginEyebrow"></div>
      <h1 data-i18n="loginH"></h1>
      <p class="sub" data-i18n="loginSub"></p>
      <label><span data-i18n="loginUser"></span><input id="user" autocomplete="username" autofocus /></label>
      <label><span data-i18n="loginPass"></span><input id="password" type="password" autocomplete="current-password" /></label>
      <button type="submit" id="submit" data-i18n="loginBtn"></button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
    <script type="module">
      import { LANGS, TEXTS } from '/js/i18n.js';

      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      let lang = [params.get('lang'), localStorage.getItem('lang'), navigator.language.slice(0, 2)].find((l) => LANGS.includes(l)) || 'en';
      let msgKey = null;

      function draw() {
        const t = TEXTS[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = t[el.dataset.i18n]));
        $('langSel').setAttribute('aria-label', t.langLabel);
        $('msg').textContent = msgKey ? t[msgKey] : '';
      }
      const show = (key, info) => {
        msgKey = key;
        $('msg').className = info ? 'msg info' : 'msg';
        draw();
      };

      $('langSel').innerHTML = LANGS.map((id) => `<option value="${id}">${id.toUpperCase()}</option>`).join('');
      $('langSel').value = lang;
      $('langSel').addEventListener('change', (e) => {
        lang = e.target.value;
        localStorage.setItem('lang', lang);
        draw();
      });
      draw();

      // Nur Pfade auf diesem Server als Ziel zulassen
      let next = params.get('next') || '';
      if (!/^\/(?![\/\\])/.test(next)) next = '/';
      // Mit der hier gewählten Sprache weiter
      const go = () => {
        const url = new URL(next, location.origin);
        url.searchParams.set('lang', lang);
        location.replace(url.pathname + url.search + url.hash);
      };

      const me = await fetch('/api/me').then((r) => r.json()).catch(() => null);
      // Ohne Passwort in der .env gibt es keinen Login: direkt in den Editor
      if (me?.user || (me && !me.loginEnabled)) go();

      const ERRORS = { 429: 'loginLocked', 503: 'loginDisabled' };
      $('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = $('user').value.trim();
        const password = $('password').value;
        if (!user || !password) return show('loginMissing');
        $('submit').disabled = true;
        show(null);
        try {
          const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, password }) });
          if (r.ok) return go();
          show(ERRORS[r.status] || 'loginWrong');
          $('password').value = '';
        } catch {
          show('loginNoServer');
        } finally {
          $('submit').disabled = false;
        }
      });
    </script>
  </body>
</html>

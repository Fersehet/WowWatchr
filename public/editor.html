<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WowWatchr Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/editor.css" />
  </head>
  <body>
    <div class="intro" id="intro" role="status">
      <div class="intro-inner">
        <svg class="intro-logo" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
          <defs><mask id="intro-cut"><rect x="-8" y="-8" width="80" height="80" fill="#fff" /><g fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"><path d="M32 9L35.5 14V40H28.5V14Z" /><rect x="22" y="40" width="20" height="4.5" rx="2.2" /><rect x="30.2" y="44.5" width="3.6" height="7" /><circle cx="32" cy="54.5" r="3.2" /></g></mask></defs>
          <g mask="url(#intro-cut)"><circle class="i-track" cx="32" cy="32" r="24" fill="none" stroke="#ffd100" stroke-opacity=".28" stroke-width="7" /><circle class="i-arc" cx="32" cy="32" r="24" fill="none" stroke="#ffd100" stroke-width="7" pathLength="100" stroke-dasharray="70 100" transform="rotate(-90 32 32)" /></g>
          <g class="i-sword" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"><path d="M32 9L35.5 14V40H28.5V14Z" /><rect x="22" y="40" width="20" height="4.5" rx="2.2" /><rect x="30.2" y="44.5" width="3.6" height="7" /><circle cx="32" cy="54.5" r="3.2" /></g>
        </svg>
        <img class="intro-word" src="/logo-wordmark.svg" alt="" width="184" height="28" />
        <div class="intro-bar"><i></i></div>
      </div>
    </div>
    <header>
      <div class="head-left">
        <div class="brand"><img class="brand-mark" src="/logo.svg" alt="" width="30" height="30" /><img class="brand-word" src="/logo-wordmark.svg" alt="WowWatchr" width="118" height="18" /></div>
        <div class="status" id="status" data-i18n="demo"></div>
      </div>
      <nav class="tabs" id="tabs" role="group"></nav>
      <div class="account">
        <select id="editorLang" class="lang"></select>
        <span id="accountName"></span>
        <button id="logout" class="head-btn" type="button" data-i18n="logout"></button>
      </div>
    </header>
    <main>
      <aside>
        <section>
          <h2 data-i18n="character"></h2>
          <div class="grid">
            <label><span data-i18n="name"></span><input id="name" maxlength="40" /></label>
            <label><span data-i18n="realm"></span><input id="realm" maxlength="40" /></label>
          </div>
        </section>
        <section>
          <h2 data-i18n="layout"></h2>
          <div class="choices" id="layouts"></div>
        </section>
        <section>
          <h2 data-i18n="pages"></h2>
          <ul class="pages" id="pages"></ul>
          <label class="field"><span data-i18n="interval"></span><input id="interval" type="number" min="3" max="120" /></label>
        </section>
        <section>
          <h2 data-i18n="design"></h2>
          <div class="grid">
            <label><span data-i18n="overlayLang"></span><select id="overlayLang"></select></label>
            <label><span data-i18n="accent"></span><input id="accent" type="color" /></label>
          </div>
          <button id="accentReset" type="button" class="full" data-i18n="accentReset"></button>
        </section>
        <section>
          <h2 data-i18n="obs"></h2>
          <div id="links"></div>
          <p class="hint" id="obsHint"></p>
        </section>
      </aside>
      <div class="preview-area">
        <div class="stage" id="stage"><iframe id="frame" title="WowWatchr"></iframe></div>
        <p class="hint" data-i18n="checker"></p>
      </div>
    </main>
    <script type="module" src="/js/editor.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WowWatchr Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/editor.css" />
  </head>
  <body>
    <div class="intro" id="intro" role="status">
      <div class="intro-inner">
        <svg class="intro-logo" viewBox="0 0 64 64" width="96" height="96" aria-hidden="true">
          <defs><mask id="intro-cut"><rect x="-8" y="-8" width="80" height="80" fill="#fff" /><g fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"><path d="M32 9L35.5 14V40H28.5V14Z" /><rect x="22" y="40" width="20" height="4.5" rx="2.2" /><rect x="30.2" y="44.5" width="3.6" height="7" /><circle cx="32" cy="54.5" r="3.2" /></g></mask></defs>
          <g mask="url(#intro-cut)"><circle class="i-track" cx="32" cy="32" r="24" fill="none" stroke="#ffd100" stroke-opacity=".28" stroke-width="7" /><circle class="i-arc" cx="32" cy="32" r="24" fill="none" stroke="#ffd100" stroke-width="7" pathLength="100" stroke-dasharray="70 100" transform="rotate(-90 32 32)" /></g>
          <g class="i-sword" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"><path d="M32 9L35.5 14V40H28.5V14Z" /><rect x="22" y="40" width="20" height="4.5" rx="2.2" /><rect x="30.2" y="44.5" width="3.6" height="7" /><circle cx="32" cy="54.5" r="3.2" /></g>
        </svg>
        <img class="intro-word" src="/logo-wordmark.svg" alt="" width="184" height="28" />
        <div class="intro-bar"><i></i></div>
      </div>
    </div>
    <header>
      <div class="head-left">
        <div class="brand"><img class="brand-mark" src="/logo.svg" alt="" width="30" height="30" /><img class="brand-word" src="/logo-wordmark.svg" alt="WowWatchr" width="118" height="18" /></div>
        <div class="status" id="status"></div>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="overlay" data-i18n="tabOverlay"></button>
        <button type="button" role="tab" data-tab="stats" data-i18n="tabStats"></button>
      </nav>
      <div class="account">
        <select id="editorLang" class="lang"></select>
        <span id="accountName"></span>
        <button id="logout" class="head-btn" type="button" data-i18n="logout"></button>
      </div>
    </header>
    <!-- Ansichten-Leiste rechts wie bei FaceitWatchr -->
    <nav class="rail" id="rail">
      <div class="rail-track" aria-hidden="true"><i></i></div>
      <a href="#" data-tab="overlay"><span><b>01</b><em data-i18n="tabOverlay"></em></span></a>
      <a href="#stats" data-tab="stats"><span><b>02</b><em data-i18n="tabStats"></em></span></a>
    </nav>
    <main id="overlayView">
      <aside>
        <section>
          <h2 data-i18n="character"></h2>
          <div class="grid">
            <label><span data-i18n="name"></span><input id="name" maxlength="40" /></label>
            <label><span id="realmLabel"></span><input id="realm" maxlength="40" /></label>
          </div>
          <div class="grid">
            <label><span data-i18n="game"></span><select id="game"><option value="retail">Retail</option><option value="forever">Forever</option></select></label>
            <label><span data-i18n="region"></span><select id="region"></select></label>
          </div>
        </section>
        <section>
          <h2 data-i18n="layout"></h2>
          <div class="choices" id="layouts"></div>
        </section>
        <section>
          <h2 data-i18n="pages"></h2>
          <ul class="pages" id="pages"></ul>
          <label class="field"><span data-i18n="interval"></span><input id="interval" type="number" min="3" max="120" /></label>
        </section>
        <section>
          <h2 data-i18n="design"></h2>
          <div class="grid">
            <label><span data-i18n="overlayLang"></span><select id="overlayLang"></select></label>
            <label><span data-i18n="accent"></span><input id="accent" type="color" /></label>
          </div>
          <button id="accentReset" type="button" class="full" data-i18n="accentReset"></button>
          <label class="field"><span data-i18n="scale"></span><input id="scale" type="number" min="50" max="300" step="1" /></label>
          <p class="hint" data-i18n="scaleHint"></p>
          <label class="field"><span data-i18n="bgColor"></span><input id="bgColor" type="color" /></label>
          <label class="field"><span class="split"><span data-i18n="opacity"></span><output id="opacityValue"></output></span><input id="opacity" type="range" min="0" max="100" step="1" /></label>
          <button id="bgReset" type="button" class="full" data-i18n="bgReset"></button>
          <label class="field"><span data-i18n="diffColors"></span><select id="diffColors"><option value="on" data-i18n="diffColored"></option><option value="off" data-i18n="diffAccent"></option></select></label>
        </section>
        <section>
          <h2 data-i18n="obs"></h2>
          <div id="links"></div>
          <p class="hint" id="obsHint"></p>
        </section>
        <section>
          <h2 data-i18n="discord"></h2>
          <div class="link" id="discordConnect">
            <label for="discordUrl" data-i18n="discordHook"></label>
            <div class="row"><input id="discordUrl" type="password" autocomplete="off" spellcheck="false" placeholder="https://discord.com/api/webhooks/…" /><button id="discordSave" type="button" data-i18n="discordSave"></button></div>
          </div>
          <p class="hint" id="discordState" role="status"></p>
          <button id="discordRemove" type="button" class="full" data-i18n="discordRemove" hidden></button>
          <div class="grid">
            <label><span data-i18n="discordStyle"></span><select id="discordStyle"><option value="table" data-i18n="discordTable"></option><option value="tiles" data-i18n="discordTiles"></option><option value="mix" data-i18n="discordMix"></option></select></label>
            <label><span data-i18n="discordLang"></span><select id="discordLang"></select></label>
          </div>
          <button id="discordTest" type="button" class="full" data-i18n="discordTest"></button>
          <p class="hint" data-i18n="discordHint"></p>
        </section>
      </aside>
      <div class="preview-area">
        <!-- Welche Seite die Vorschau zeigt -->
        <div class="page-picker" id="pagePicker" role="group"></div>
        <div class="stage" id="stage"><iframe id="frame" title="WowWatchr"></iframe></div>
        <p class="hint" data-i18n="checker"></p>
      </div>
    </main>

    <div id="statsView" class="stats-view" hidden>
      <div class="stats-grid">
        <div class="panel">
          <div class="panel-head"><span id="chartHead"></span><b id="chartScore">–</b></div>
          <svg id="ratingChart" class="chart" viewBox="0 0 600 236" role="img"></svg>
          <dl class="trend">
            <div><dt data-i18n="best"></dt><b id="trBest" class="gold">–</b></div>
            <div><dt data-i18n="timed"></dt><b id="trTimed">–</b></div>
            <div><dt data-i18n="stAvgKey"></dt><b id="trAvg">–</b></div>
          </dl>
          <p class="example" id="chartNote"></p>
        </div>
        <div class="panel">
          <div class="panel-head"><span id="seasonHead"></span><span id="seasonName"></span></div>
          <dl class="session">
            <div><dt data-i18n="score"></dt><b id="ssScore" class="gold">–</b></div>
            <div><dt data-i18n="best"></dt><b id="ssBest">–</b></div>
            <div><dt data-i18n="stTimed"></dt><b id="ssTimed">–</b></div>
            <div><dt data-i18n="stRaidProgress"></dt><b id="ssRaid">–</b></div>
            <div><dt data-i18n="stBossKills"></dt><b id="ssKills">–</b></div>
          </dl>
          <p class="example" id="seasonNote"></p>
        </div>
      </div>
      <div class="panel list-panel">
        <div class="panel-head"><span id="listHead"></span><span id="listHint"></span></div>
        <div class="run-filter">
          <label><span id="dayLabel"></span> <input type="date" id="runDay"></label>
          <button id="runDayAll" type="button" hidden></button>
        </div>
        <ul class="runs" id="runList"></ul>
        <div class="pager" id="runPager" hidden>
          <button id="pagePrev" type="button" class="page-btn">‹</button>
          <span id="pageInfo"></span>
          <button id="pageNext" type="button" class="page-btn">›</button>
          <label class="per-page"><span id="perPageLabel"></span>
            <select id="perPage"><option>10</option><option>25</option><option>50</option><option>100</option></select>
          </label>
        </div>
      </div>
    </div>
    <script type="module" src="/js/editor.js"></script>
  </body>
</html>

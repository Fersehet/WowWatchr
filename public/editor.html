<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WowWatchr Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/editor.css" />
  </head>
  <body>
    <div class="intro" id="intro" role="status">
      <div class="intro-inner">
        <svg class="intro-logo" viewBox="-2 -2 68 68" width="96" height="96" aria-hidden="true">
          <defs>
            <mask id="intro-cut">
              <rect x="-8" y="-8" width="80" height="80" fill="#fff" />
              <path d="M32 11L36 15V38.5H39.4A2.6 2.6 0 0 1 39.4 43.7H34.3V49.6A3.2 3.2 0 1 1 29.7 49.6V43.7H24.6A2.6 2.6 0 0 1 24.6 38.5H28V15Z" fill="#000" stroke="#000" stroke-width="5" stroke-linejoin="round" />
            </mask>
          </defs>
          <g mask="url(#intro-cut)">
            <circle class="i-track" cx="32" cy="32" r="21" fill="none" stroke="#50430a" stroke-width="6" />
            <circle class="i-timer" cx="32" cy="32" r="21" fill="none" stroke="#ffd100" stroke-width="6" pathLength="100" transform="rotate(-90 32 32)" />
          </g>
          <path class="i-fill" d="M32 11L36 15V38.5H39.4A2.6 2.6 0 0 1 39.4 43.7H34.3V49.6A3.2 3.2 0 1 1 29.7 49.6V43.7H24.6A2.6 2.6 0 0 1 24.6 38.5H28V15Z" fill="#fff" />
          <path class="i-line" d="M32 11L36 15V38.5H39.4A2.6 2.6 0 0 1 39.4 43.7H34.3V49.6A3.2 3.2 0 1 1 29.7 49.6V43.7H24.6A2.6 2.6 0 0 1 24.6 38.5H28V15Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" pathLength="100" />
        </svg>
        <img class="intro-word" src="/logo-wordmark.svg" alt="" width="161" height="28" />
        <div class="intro-bar"><i></i></div>
      </div>
    </div>
    <header>
      <div class="head-left">
        <div class="brand"><img class="brand-mark" src="/logo.svg" alt="" width="30" height="30" /><img class="brand-word" src="/logo-wordmark.svg" alt="WowWatchr" width="104" height="18" /></div>
        <div class="status" id="status"></div>
      </div>
      <nav class="tabs" id="tabs" role="group"></nav>
      <div class="account">
        <select id="editorLang" class="lang"></select>
        <span id="accountName"></span>
        <button id="logout" class="head-btn" type="button" data-i18n="logout"></button>
      </div>
    </header>
    <main>
      <aside>
        <section>
          <h2 data-i18n="character"></h2>
          <div class="grid">
            <label><span data-i18n="name"></span><input id="name" maxlength="40" /></label>
            <label><span data-i18n="realm"></span><input id="realm" maxlength="40" /></label>
          </div>
        </section>
        <section>
          <h2 data-i18n="layout"></h2>
          <div class="choices" id="layouts"></div>
        </section>
        <section>
          <h2 data-i18n="pages"></h2>
          <ul class="pages" id="pages"></ul>
          <label class="field"><span data-i18n="interval"></span><input id="interval" type="number" min="3" max="120" /></label>
        </section>
        <section>
          <h2 data-i18n="design"></h2>
          <div class="grid">
            <label><span data-i18n="overlayLang"></span><select id="overlayLang"></select></label>
            <label><span data-i18n="accent"></span><input id="accent" type="color" /></label>
          </div>
          <button id="accentReset" type="button" class="full" data-i18n="accentReset"></button>
        </section>
        <section>
          <h2 data-i18n="obs"></h2>
          <div id="links"></div>
          <p class="hint" id="obsHint"></p>
        </section>
      </aside>
      <div class="preview-area">
        <div class="stage" id="stage"><iframe id="frame" title="WowWatchr"></iframe></div>
        <p class="hint" data-i18n="checker"></p>
      </div>
    </main>
    <script type="module" src="/js/editor.js"></script>
  </body>
</html>
